# CI (D-013): repository rules, then build + tests on Windows, Linux and macOS.
# Hosted runners have no GPU: tests labelled `gpu` are skipped and the perf report is
# simulation-only. Actions are pinned by commit SHA (tag in the comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: lint and repository rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Source lint (Z001-Z007)
        run: python tools/lint.py
      - name: PR title is a valid squash commit header (G001-G003)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python tools/git_rules.py pr-title "$TITLE"
      - name: Every PR commit is formatted and signed off (G001-G004)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/git_rules.py commits "$BASE..$HEAD"

  build:
    name: build and test (${{ matrix.os }})
    needs: rules
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sh tools/ci/install-linux-deps.sh
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Cache pinned dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/deps/*-subbuild/*-populate-prefix/src
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/ZaroDeps.cmake') }}
      - name: Build, engine build-time budget, tests
        run: python tools/build.py release --test --no-gpu-tests --engine-budget=180
      - name: Simulation benchmark (no GPU)
        run: |
          build/release/zaro run --sim-only --enemies 50000 --warmup 60 --frames 600 \
            --perf perf-${{ matrix.os }}.json
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          d = json.load(open(glob.glob("perf-*.json")[0]))
          print(f"### Simulation benchmark ({d['threads']} threads)")
          print(f"enemies {d['enemies']}, sim {d['cpu_ms']['sim']:.3f} ms/tick, "
                f"frame avg {d['frame_ms']['avg']:.3f} ms, p99 {d['frame_ms']['p99']:.3f} ms, "
                f"state_hash {d['state_hash']}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.os }}
          path: perf-*.json

  # Android APK of the crowd example (D-022). Running it needs a device, so that stays local:
  # python tools/android.py perf
  android:
    name: android apk
    needs: rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System packages
        run: sh tools/ci/install-linux-deps.sh
      - name: Cache pinned dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/deps/*-subbuild/*-populate-prefix/src
          key: deps-android-${{ hashFiles('cmake/ZaroDeps.cmake') }}
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/zaro/downloads
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('tools/android.py', 'src/platform/android/project/**') }}
      - name: Android toolchain (pinned NDK, SDK packages, Gradle)
        run: python tools/android.py setup --accept-licenses
      - name: Host zaro (runs the export)
        run: python tools/build.py release
      - name: APK
        run: python tools/android.py apk examples/crowd/scene.toml
      - name: The APK holds the cooked cat atlas, not its SVG files (D-026)
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("build/android-project/app/build/outputs/apk/debug/*.apk")[0]).namelist()
          assets = [n for n in names if n.startswith("assets/game/")]
          for n in assets:
              print(n)
          if not any(n.endswith(".zaro-cache/cat.png") for n in assets):
              sys.exit("the cooked sprite atlas .zaro-cache/cat.png is missing from the APK")
          if any(n.endswith(".svg") for n in assets):
              sys.exit("SVG files were packed into the APK")
          PY
      - name: App Bundle, debug key (bundletool validate, 16 KB alignment)
        run: python tools/android.py aab examples/crowd/scene.toml
      # The release signing path with a key made for this run only; real upload keys live in each
      # game's repository (docs/android-release.md, D-025).
      - name: Release App Bundle, throwaway upload key
        run: |
          umask 077
          export ZARO_UPLOAD_KEYSTORE="$RUNNER_TEMP/throwaway-upload.p12"
          export ZARO_UPLOAD_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export ZARO_UPLOAD_KEY_ALIAS=upload
          export ZARO_UPLOAD_KEY_PASSWORD="$ZARO_UPLOAD_KEYSTORE_PASSWORD"
          keytool -genkeypair -keystore "$ZARO_UPLOAD_KEYSTORE" -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=ZARO CI throwaway upload key" \
            -storepass "$ZARO_UPLOAD_KEYSTORE_PASSWORD" -keypass "$ZARO_UPLOAD_KEY_PASSWORD"
          python tools/android.py aab examples/crowd/scene.toml --release \
            --version-code "${{ github.run_number }}"
          rm -f "$ZARO_UPLOAD_KEYSTORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zaro-crowd-apk
          path: build/android-project/app/build/outputs/apk/debug/*.apk
