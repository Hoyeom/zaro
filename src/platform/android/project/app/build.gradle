plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.zaro'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = '@ZARO_PACKAGE@'
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '@ZARO_VERSION@'
        ndk {
            abiFilters.add('arm64-v8a')
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Local and CI builds sign release APKs with the debug key; store signing is per game.
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    androidResources {
        // AAPT's default patterns also drop every file and directory starting with '.', which would
        // leave out the cooked sprite atlases in .zaro-cache/ (D-025). Same defaults, without that.
        ignoreAssetsPatterns.clear()
        ignoreAssetsPatterns.addAll(['!.svn', '!.git', '!.ds_store', '!*.scc', '<dir>_*', '!CVS', '!thumbs.db',
                                     '!picasa.ini', '!*~'])
    }

    packaging {
        jniLibs {
            // The libraries arrive stripped from the native build (cmake/ZaroAndroid.cmake).
            keepDebugSymbols.add('**/*.so')
        }
    }
}
