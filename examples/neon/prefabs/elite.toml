# A golden elite that walks at the player; only a blade takes it down (neon.luau).
[prefab]
name = "elite"

[Transform]

[Shape]
kind = "polygon"
sides = 4
position = [0.0, 0.09, 0.0]
size = [1.4, 1.4]
thickness = 0.14
color = "#ffd23d"
intensity = 3.0
glow = 0.5
spin = 90.0

[[tween]]
component = "Shape"
field = "size"
from = [0.0, 0.0]
to = [1.4, 1.4]
time = 0.5
ease = "out_elastic"
