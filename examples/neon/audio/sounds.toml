# The neon arena's sound (D-032): every sound is synthesized when the scene loads, so the game is
# text from end to end. The music and effects groups follow the volumes in the save (../save.toml),
# which the settings popup changes.
#   zaro check examples/neon/scene.toml

[[group]]
name = "music"
save = "music_volume"

[[group]]
name = "sfx"
save = "sfx_volume"

# A blade sweeping enemies away: a short burst of noise, often, so it has a cooldown.
[[sound]]
name = "sweep"
group = "sfx"
volume = 0.25
pitch = [0.85, 1.15]
voices = 4
cooldown = 0.06
synth = { wave = "noise", from = 6000, to = 1500, time = 0.05, attack = 0.001, release = 0.03 }

# A golden elite taken down: a rising chirp.
[[sound]]
name = "elite_down"
group = "sfx"
volume = 0.45
pitch = [0.95, 1.05]
synth = { wave = "square", from = 440, to = 1760, time = 0.18, attack = 0.002, release = 0.08 }

# An elite reached the player: a falling buzz.
[[sound]]
name = "player_hit"
group = "sfx"
volume = 0.6
voices = 2
synth = { wave = "saw", from = 320, to = 60, time = 0.35, attack = 0.002, release = 0.2 }

# A new wave: a quick arpeggio.
[[sound]]
name = "wave"
group = "sfx"
volume = 0.5
voices = 1
[sound.pattern]
step = 0.07
tracks = [{ wave = "triangle", notes = "A4 C5 E5 A5 -", release = 0.04 }]

# Buttons.
[[sound]]
name = "click"
group = "sfx"
volume = 0.4
synth = { wave = "sine", from = 1200, to = 900, time = 0.04, attack = 0.001, release = 0.03 }

# The music: four bars in A minor at 120 beats a minute, looping.
[[sound]]
name = "music"
group = "music"
loop = true
[sound.pattern]
step = 0.125
tracks = [
  { wave = "saw", volume = 0.3, release = 0.04, notes = "A1 - A2 . A1 - A2 . | F1 - F2 . F1 - F2 . | C2 - C3 . C2 - C3 . | G1 - G2 . G1 - G2 ." },
  { wave = "square", volume = 0.1, release = 0.05, notes = "A4 C5 E5 A5 E5 C5 A4 E4 | F4 A4 C5 F5 C5 A4 F4 C4 | C5 E5 G5 C6 G5 E5 C5 G4 | G4 B4 D5 G5 D5 B4 G4 D4" },
  { wave = "sine", volume = 0.5, release = 0.1, notes = "A1 . . . A1 . . ." },
  { wave = "noise", volume = 0.06, attack = 0.0, release = 0.02, notes = ". C8 . C8" },
]
