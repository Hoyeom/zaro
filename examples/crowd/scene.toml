# The M1 crowd demo as a scene. Validate with:  zaro check examples/crowd/scene.toml
# Every component and field is listed by:       zaro schema

[scene]
name = "crowd"
script = "crowd.luau"

[[entity]]
name = "arena"
[entity.CrowdArena]
grid_size = 256
seed = 1

[[entity]]
name = "horde"
[entity.CrowdSpawner]
count = 50000
speed = 4.0
# The enemies are the cat from examples/cats, walking. Without this table they are cubes.
[entity.CrowdSprite]
sheet = "../cats/cat.toml"
animation = "walk"
scale = 0.6

[[entity]]
name = "player"
prefab = "prefabs/player.toml"
