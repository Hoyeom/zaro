# How `zaro build` builds the crowd example (D-027).
#   zaro build examples/crowd/build.toml --plan
#   zaro build examples/crowd/build.toml --env production --version-code 2
[game]
name = "crowd"
scene = "scene.toml"
version = "0.1.0"

[environment.dev]
debug_tools = true
[environment.dev.config]
log_level = "info"

[environment.production]
release = true
[environment.production.config]
log_level = "warning"

# The enemies are the SVG cat from examples/cats (D-028): cook it before anything is packaged.
[[step]]
stage = "pre"
name = "cook"
uses = "cook-svg"

[[step]]
stage = "pre"
name = "scene-tests"
uses = "test"
with = ["tests"]
