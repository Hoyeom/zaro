# The settings popup: a modal panel with sound and language rows and a close button. The HUD's
# button opens it (action "open:settings"); Close, Escape or Android back close it. Colours, sizes
# and spacing come from the design kit (kit/theme.toml, made by `zaro import-design`), and the
# panel and buttons are the kit's components (kit/*.toml prefabs).
#   zaro check examples/hello/ui/settings.toml
[screen]
name = "settings"
theme = "kit/theme.toml"
reference = [1280, 720]
navigable = true
transition = "pop"

[[node]]
name = "popup"
[node.Modal]
dim_color = "$dim"

[[node]]
name = "panel"
parent = "popup"
prefab = "kit/popup.toml"

[[node]]
name = "title"
parent = "panel"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.title"
font = "bold"
size = "$title.size"
color = "$ink"
align = "center"

# One row per setting: a label that takes the free width, then the choices.
[[node]]
name = "sound_row"
parent = "panel"
[node.Layout]
fill_width = true
direction = "row"
align = "center"
gap = "$space-3"
[[node]]
name = "sound_label"
parent = "sound_row"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.sound"
size = "$body.size"
color = "$ink-soft"
[[node]]
name = "sound_on"
parent = "sound_row"
prefab = "kit/choice_button.toml"
[node.Button]
text = "@settings.on"
action = "sound_on"
[[node]]
name = "sound_off"
parent = "sound_row"
prefab = "kit/choice_button.toml"
[node.Button]
text = "@settings.off"
action = "sound_off"

[[node]]
name = "language_row"
parent = "panel"
[node.Layout]
fill_width = true
direction = "row"
align = "center"
gap = "$space-3"
[[node]]
name = "language_label"
parent = "language_row"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.language"
size = "$body.size"
color = "$ink-soft"
[[node]]
name = "korean"
parent = "language_row"
prefab = "kit/choice_button.toml"
[node.Button]
text = "한국어"
action = "language_ko"
[[node]]
name = "english"
parent = "language_row"
prefab = "kit/choice_button.toml"
[node.Button]
text = "English"
action = "language_en"

[[node]]
name = "close"
parent = "panel"
prefab = "kit/button.toml"
[node.Layout]
fill_width = true
height = 56
[node.Button]
text = "@settings.close"
action = "close"
size = 24
