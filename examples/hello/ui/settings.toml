# The settings popup: a modal panel with sound and language rows and a close button.
# Hidden until something opens it (the popup node's Layout.visible).
#   zaro check examples/hello/ui/settings.toml
[screen]
name = "settings"
reference = [1280, 720]
navigable = true

[[node]]
name = "popup"
[node.Layout]
visible = false
[node.Modal]
dim_color = "#000000a0"

[[node]]
name = "panel"
parent = "popup"
[node.Layout]
width = 520
anchor = [0.5, 0.5]
direction = "column"
padding = [32, 28, 32, 28]
gap = 20
[node.Panel]
color = "#f7f5f0"
radius = 20

[[node]]
name = "title"
parent = "panel"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.title"
font = "bold"
size = 32
color = "#1e1e24"
align = "center"

# One row per setting: a label that takes the free width, then the choices.
[[node]]
name = "sound_row"
parent = "panel"
[node.Layout]
fill_width = true
direction = "row"
align = "center"
gap = 12
[[node]]
name = "sound_label"
parent = "sound_row"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.sound"
size = 24
color = "#3c3c46"
[[node]]
name = "sound_on"
parent = "sound_row"
[node.Layout]
width = 110
height = 48
[node.Button]
text = "@settings.on"
action = "sound_on"
size = 20
[[node]]
name = "sound_off"
parent = "sound_row"
[node.Layout]
width = 110
height = 48
[node.Button]
text = "@settings.off"
action = "sound_off"
size = 20
color = "#787c88"

[[node]]
name = "language_row"
parent = "panel"
[node.Layout]
fill_width = true
direction = "row"
align = "center"
gap = 12
[[node]]
name = "language_label"
parent = "language_row"
[node.Layout]
fill_width = true
[node.Label]
text = "@settings.language"
size = 24
color = "#3c3c46"
[[node]]
name = "korean"
parent = "language_row"
[node.Layout]
width = 110
height = 48
[node.Button]
text = "한국어"
action = "language_ko"
size = 20
font = "regular"
[[node]]
name = "english"
parent = "language_row"
[node.Layout]
width = 110
height = 48
[node.Button]
text = "English"
action = "language_en"
size = 20
font = "regular"

[[node]]
name = "close"
parent = "panel"
[node.Layout]
fill_width = true
height = 56
[node.Button]
text = "@settings.close"
action = "close"
size = 24
