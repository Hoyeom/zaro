# The HUD over the arena: a top bar with the title, the player's speed and a settings button,
# and a hint in the bottom-left corner. Texts starting with @ come from ../strings/<language>.toml;
# values starting with $ are design tokens from kit/theme.toml (`zaro import-design`).
#   zaro check examples/hello/ui/hud.toml
[screen]
name = "hud"
theme = "kit/theme.toml"
reference = [1280, 720]

[[node]]
name = "top_bar"
[node.Layout]
fill_width = true
height = 72
direction = "row"
align = "center"
gap = "$space-4"
padding = ["$space-6", 0, "$space-4", 0]
[node.Panel]
color = "$bar"

[[node]]
name = "title"
parent = "top_bar"
[node.Label]
text = "@hud.title"
font = "bold"
size = "$heading.size"
color = "$on-hud"

[[node]]
name = "spacer"
parent = "top_bar"
[node.Layout]
fill_width = true

[[node]]
name = "speed"
parent = "top_bar"
[node.Label]
text = "@hud.speed"
size = "$button.size"
color = "$on-hud-soft"

[[node]]
name = "settings_button"
parent = "top_bar"
prefab = "kit/button.toml"
[node.Layout]
width = 120
[node.Button]
text = "@hud.settings"
action = "open:settings"

[[node]]
name = "hint"
[node.Layout]
anchor = [0.0, 1.0]
offset = ["$space-6", -20]
padding = [14, "$space-2", 14, "$space-2"]
[node.Panel]
color = "$hint"
radius = "$radius-md"
[[node]]
name = "hint_text"
parent = "hint"
[node.Label]
text = "@hud.hint"
size = "$small.size"
color = "$on-hud"
