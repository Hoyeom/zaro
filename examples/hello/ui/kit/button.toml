# Button, from the design kit: The button that does the thing: one verb, white bold caption on `go`, `radius-sm`.
# Written as a stub by `zaro import-design`, then filled in with theme tokens ("$name" from theme.toml).
# Use it from a screen with prefab = "kit/button.toml" on a [[node]].
[prefab]
name = "Button"

[Layout]
height = 48

[Button]
font = "bold"
size = "$button.size"
text_color = "$on-button"
color = "$go"
hover_color = "$go-hover"
pressed_color = "$go-pressed"
disabled_color = "$disabled"
radius = "$radius-sm"
