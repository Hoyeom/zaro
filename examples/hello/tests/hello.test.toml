# After 900 ticks (15 s) hello.luau has raised the player speed three times: 6.0 + 3 x 0.5.
[test]
state_hash = "d5c5edfa50c693ff"
scene = "../scene.toml"
ticks = 900

[[expect]]
entity = "player"
component = "PlayerController"
field = "speed"
equals = 7.5

# The HUD shows the new speed through the view-model value {speed}; the popup stays closed.
[[expect]]
screen = "hud"
node = "speed"
text = "속도 7.5 m/s"

[[expect]]
screen = "settings"
node = "popup"
component = "Layout"
field = "visible"
equals = false
