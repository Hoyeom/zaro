# The smallest scene with a script: a small horde, a player, and hello.luau, with a HUD and a
# settings popup in Korean and English (ui/, strings/).
#   zaro check examples/hello/scene.toml
#   zaro run examples/hello/scene.toml [--lang en]
[scene]
name = "hello"
script = "hello.luau"
ui = ["ui/hud.toml", "ui/settings.toml"]
strings = "strings"
languages = ["ko", "en"]

[[entity]]
name = "arena"
[entity.CrowdArena]
grid_size = 64
seed = 42

[[entity]]
name = "horde"
[entity.CrowdSpawner]
count = 300
speed = 2.0

[[entity]]
name = "player"
[entity.PlayerController]
speed = 6.0
