<?xml version="1.0" encoding="UTF-8"?>
<!-- ZARO example art: Nabi the cat, idle frame 1. Drawn for the P3 SVG pipeline. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .fur { fill: url(#fur); }
      .far { fill: #c4652a; }
      .stripe { fill: #b9541f; }
      .belly { fill: #fbe3c4; }
      .ink { fill: #2b1d16; }
      .shine { fill: #ffffff; }
      .nose { fill: #e8857f; }
      .inner { fill: #f2b49a; }
      .whisker { fill: none; stroke: #2b1d16; stroke-width: 1.2; stroke-linecap: round; }
      .tail { fill: none; stroke: #e2842f; stroke-width: 9; stroke-linecap: round; }
    </style>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a955"/>
      <stop offset="1" stop-color="#df7a2c"/>
    </linearGradient>
    <clipPath id="body-clip">
      <ellipse cx="60" cy="76" rx="31" ry="17"/>
    </clipPath>
    <symbol id="leg" viewBox="0 0 10 30" overflow="visible">
      <rect x="0" y="0" width="10" height="27" rx="5"/>
      <ellipse cx="5" cy="27" rx="6" ry="3.5"/>
    </symbol>
  </defs>
  <path class="tail" d="M 32 70 C 18 62 19 40 29 26"/>
  <use xlink:href="#leg" class="far" x="44" y="82" width="10" height="30" transform="rotate(0 49 82)"/>
  <use xlink:href="#leg" class="far" x="82" y="82" width="10" height="30" transform="rotate(0 87 82)"/>
  <ellipse class="fur" cx="60" cy="76" rx="31" ry="17"/>
  <g clip-path="url(#body-clip)">
    <ellipse class="belly" cx="64" cy="87" rx="24" ry="9"/>
    <path class="stripe" d="M 40 59 q 4 9 0 18 l 5 0 q 3 -9 0 -18 z"/>
    <path class="stripe" d="M 52 59 q 4 8 0 15 l 5 0 q 3 -8 0 -15 z"/>
    <path class="stripe" d="M 64 59 q 4 8 0 14 l 5 0 q 3 -7 0 -14 z"/>
  </g>
  <use xlink:href="#leg" class="fur" x="38" y="82" width="10" height="30" transform="rotate(0 43 82)"/>
  <use xlink:href="#leg" class="fur" x="76" y="82" width="10" height="30" transform="rotate(0 81 82)"/>
  <g transform="translate(0 0.0)">
    <path class="fur" d="M 82 44 L 85 22 L 98 37 Z"/>
    <path class="inner" d="M 85 40 L 87 28 L 94 37 Z"/>
    <path class="fur" d="M 100 38 L 110 20 L 113 43 Z"/>
    <path class="inner" d="M 103 39 L 109 27 L 110 41 Z"/>
    <circle class="fur" cx="96" cy="52" r="18"/>
    <path class="stripe" d="M 92 35 q 4 5 0 9 l 3 0 q 3 -5 0 -9 z"/>
    <ellipse class="belly" cx="103" cy="60" rx="9" ry="7"/>
    <ellipse class="ink" cx="101" cy="49" rx="3.2" ry="4.2"/>
    <circle class="shine" cx="102.2" cy="47.5" r="1.1"/>
