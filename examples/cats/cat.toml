# Nabi the cat: SVG frames, cooked into a PNG atlas by the zaro tool (D-028). Cook explicitly with:
#   zaro cook examples/cats/cat.toml
[sheet]
svg = [
  "art/cat_walk_0.svg", "art/cat_walk_1.svg", "art/cat_walk_2.svg", "art/cat_walk_3.svg",
  "art/cat_idle_0.svg", "art/cat_idle_1.svg", "art/cat_idle_2.svg", "art/cat_idle_3.svg",
]
size = [128, 128]
pixels_per_unit = 64
pivot = [0.5, 0.88]

[[animation]]
name = "walk"
frames = [0, 1, 2, 3]
fps = 8.0

[[animation]]
name = "idle"
frames = [4, 5, 6, 5, 4, 4, 7, 4]
fps = 4.0
