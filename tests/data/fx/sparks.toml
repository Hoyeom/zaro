# GPU particles, shake and flash (zaro-fx): enemies that reach the player burst into sparks and
# shake the camera; a fountain emits at a steady rate; a script-style burst waits in `burst`.
[scene]
name = "sparks"

[[entity]]
name = "arena"
[entity.CrowdArena]
grid_size = 64
[entity.ArenaLook]
grid_intensity = 1.2

[[entity]]
name = "horde"
[entity.CrowdSpawner]
count = 1200
speed = 5.0
[entity.CrowdShape]
kind = "rect"
size = 0.6
color = "#ff8a2b"
intensity = 2.5
[entity.CrowdFx]
particles = 8
color = "#ffb050"
intensity = 4.0
shake = 0.05
player_flash = 1.0

[[entity]]
name = "player"
[entity.Shape]
kind = "ring"
follow = "player"
position = [0.0, 0.05, 0.0]
size = [1.4, 1.4]
color = "#33e6ff"
intensity = 3.0
glow = 0.25
flash_decay = 3.0

[[entity]]
name = "fountain"
[entity.ParticleEmitter]
position = [30.0, 0.3, 36.0]
rate = 400.0
color = "#66ccff"
intensity = 3.0
speed = 8.0
direction = -90.0
spread = 40.0

[[entity]]
name = "blast"
[entity.ParticleEmitter]
position = [36.0, 0.3, 30.0]
burst = 300
color = "#ff66ff"
intensity = 4.0
speed = 10.0
life = 3.0
drag = 1.0

[[entity]]
name = "post"
[entity.Bloom]
[entity.ScreenFx]
shake_strength = 0.4
