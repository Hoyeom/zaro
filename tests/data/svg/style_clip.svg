<?xml version="1.0" encoding="UTF-8"?>
<!-- A stylesheet class fills a square; a circular clip path cuts its corners off. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .body { fill: #e07030; }
      .eye { fill: #202020; }
    </style>
    <clipPath id="round">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect class="body" x="0" y="0" width="64" height="64"/>
  </g>
  <rect class="eye" x="20" y="24" width="6" height="6"/>
</svg>
