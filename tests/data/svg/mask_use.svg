<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 32">
  <!-- Left: a symbol placed twice with <use>. Right: a gradient square masked to its left half. -->
  <defs>
    <symbol id="dot" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="#2080f0"/></symbol>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#40c040"/></linearGradient>
    <mask id="half"><rect x="32" y="0" width="16" height="32" fill="#ffffff"/></mask>
  </defs>
  <use xlink:href="#dot" x="2" y="2" width="12" height="12"/>
  <use href="#dot" x="2" y="18" width="12" height="12"/>
  <rect x="32" y="0" width="32" height="32" fill="url(#fade)" mask="url(#half)"/>
</svg>
