# Sprites that a script spawns and destroys (D-031): the sprite layer follows the entities.
#   zaro screenshot tests/data/sprites/spawn_scene.toml spawn.png --frames 20
[scene]
name = "sprite-spawn"
script = "spawn.luau"
prefabs = ["spark.toml"]

[[entity]]
name = "arena"
[entity.CrowdArena]
grid_size = 64

[[entity]]
name = "horde"
[entity.CrowdSpawner]
count = 0
